name: Android Verify

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Run URL policy tests
        run: ./gradlew :app:testDebugUnitTest --tests '*UrlPolicyTest'
      - name: Compile instrumentation tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin
