name: Android Verify

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Verify project contract
        run: node scripts/verify-project.mjs
      - name: Verify bundled web course
        run: node scripts/verify-web-assets.mjs
      - name: Scan for signing secrets
        run: bash scripts/check-no-secrets.sh
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, lint and assemble debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Compile instrumentation tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medlit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
