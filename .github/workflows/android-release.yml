name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/medlit-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate signing secrets
        shell: bash
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
      - name: Prepare signing keystore
        shell: bash
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Build signed release APK
        run: ./gradlew assembleRelease
      - name: Verify and checksum APK
        shell: bash
        run: |
          mkdir -p dist
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" dist/medlit-1.0.0-release.apk
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          apksigner verify --verbose dist/medlit-1.0.0-release.apk
          cd dist
          sha256sum medlit-1.0.0-release.apk > medlit-1.0.0-release.apk.sha256
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: medlit-1.0.0-release
          path: |
            dist/medlit-1.0.0-release.apk
            dist/medlit-1.0.0-release.apk.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
